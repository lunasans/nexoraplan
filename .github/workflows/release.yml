# Prüft jeden Stand und baut den Release für NexoraPanel – ohne PowerShell,
# also auch vom Handy aus:
#   - Pull Request: nur prüfen (Oberfläche, go vet, Tests mit MariaDB)
#   - Push auf main: prüfen und Release v<Datum> veröffentlichen
#   - Von Hand: GitHub → Actions → „Release“ → „Run workflow“
# Release-Dateien wie bei release.ps1 (Namen erwartet das Panel genau so):
#   nexoraplan-linux-amd64, nexoraplan-linux-amd64.sha256
name: Release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read # Releases entstehen nur im nexora/App-Store

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: test
          MARIADB_DATABASE: nexoraplan_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      ASSET: nexoraplan-linux-amd64
      # nexora/App-Store: GitHub App „nexora-store-publish“ (darf nur dort schreiben).
      STORE_APP_ID: ${{ secrets.STORE_APP_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Releases gibt es nur im nexora/App-Store – von dort lädt das Panel. Das Token
      # braucht es schon hier: Die Version zählt die Releases dieser App im Store.
      - name: Token für den nexora/App-Store
        id: store
        if: env.STORE_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.STORE_APP_ID }}
          private-key: ${{ secrets.STORE_PRIVATE_KEY }}
          owner: lunasans
          repositories: nexora-app-store

      - name: Version festlegen (Datum, zweiter Release am Tag = .2)
        id: version
        env:
          GH_TOKEN: ${{ steps.store.outputs.token }}
        run: |
          v=$(TZ=Europe/Berlin date +%Y.%m.%d)
          last=""
          if [ -n "$GH_TOKEN" ]; then
            last=$(gh release list --repo lunasans/nexora-app-store --limit 100 --json tagName \
              --jq '[.[].tagName | select(startswith("nexoraplan-v"))][0] // ""' | sed 's/^nexoraplan-v//')
          fi
          if [ "$last" = "$v" ]; then
            v="$v.2"
          elif [ -n "$last" ] && [ "${last#"$v."}" != "$last" ]; then
            v="$v.$(( ${last#"$v."} + 1 ))"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"

      - name: Oberfläche prüfen und bauen
        working-directory: frontend
        env:
          PLAN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm ci
          npm run check
          npm run build

      - name: Go prüfen und testen
        env:
          PLAN_TEST_DSN: root:test@tcp(127.0.0.1:3306)/nexoraplan_test
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "gofmt nötig"; exit 1; }
          go vet ./...
          go test ./...

      - name: Linux-Binary bauen
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p build
          go build -trimpath -ldflags "-s -w -X nexoraplan/internal/server.Version=${{ steps.version.outputs.version }}" -o "build/$ASSET" ./cmd/server
          cd build && sha256sum "$ASSET" > "$ASSET.sha256" && cat "$ASSET.sha256"

      - name: Im nexora/App-Store veröffentlichen
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ steps.store.outputs.token }}
        run: |
          test -n "$GH_TOKEN" || { echo "::error::Secrets STORE_APP_ID / STORE_PRIVATE_KEY fehlen – ohne sie kein Release"; exit 1; }
          v="${{ steps.version.outputs.version }}"
          gh release create "nexoraplan-v$v" "build/$ASSET" "build/$ASSET.sha256" \
            --repo lunasans/nexora-app-store --title "nexora/plan $v" \
            --notes "Aus $GITHUB_REPOSITORY@$GITHUB_SHA."
